<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel=icon href=/static/favicon.svg type=image/svg+xml>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:#faf8f5;color:#333;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border-radius:16px;padding:40px;box-shadow:0 2px 16px rgba(0,0,0,0.04);width:100%;max-width:360px;text-align:center}
h1{font-size:1.5em;color:#e8776f;margin-bottom:6px}
.sub{color:#999;font-size:0.85em;margin-bottom:24px}
input[type=password]{width:100%;padding:12px 16px;border:1.5px solid #e5e5e5;border-radius:10px;font-size:1em;margin-bottom:16px;text-align:center}
input[type=password]:focus{outline:none;border-color:#e8776f}
.btn{display:block;width:100%;padding:12px;background:#e8776f;color:#fff;border:none;border-radius:10px;font-size:1em;font-weight:600;cursor:pointer}
.btn:hover{background:#d4665e}
.err{color:#c62828;font-size:0.85em;margin-bottom:12px}
a{color:#999;font-size:0.8em;text-decoration:none;margin-top:16px;display:inline-block}
a:hover{color:#e8776f}
</style>
</head>
<body>
<div class="card">
  <h1>小宝的成长日记</h1>
  <p class="sub">请输入管理密码</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="password" name="password" placeholder="密码" autofocus required>
    <button type="submit" class="btn">登录</button>
  </form>
  <a href="/">返回首页</a>
</div>
</body>
</html>
